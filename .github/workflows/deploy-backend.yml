name: Deploy Backend to GHCR

# 1. The Trigger: Manual dispatch only
on:
  workflow_dispatch:
    # (Optional) You could add inputs here later, like typing in a version number,
    # but leaving it empty just gives you a simple "Run workflow" button.

env:
  REGISTRY: ghcr.io
  # TODO: Change 'labsol-api' to whatever you want to name your image. 
  # Note: The entire image name must be lowercase!
  IMAGE_NAME: ${{ github.repository_owner }}/labsol-api

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    # 2. Permissions: Give GitHub Actions the right to push to your registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically generated by GitHub; you don't need to create it!
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # CRITICAL: Context is the root folder '.' so it can access 'shared/'
          context: .
          # Point it explicitly to where the Dockerfile lives
          file: ./server/Dockerfile
          push: true
          # Tags the image as 'latest'
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Optional: Cache layers to make future builds much faster
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Tell Azure to pull the new image
        run: |
          az containerapp update \
            --name labsol-api \
            --resource-group labsol-rg \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest